<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Página no encontrada · Defensa Civil Argentina</title>
  <style>
    :root{--az1:#003366;--az2:#004080;--n:#ff6600;}
    *{box-sizing:border-box}
    body{
      font-family:Arial,Helvetica,sans-serif;
      margin:0;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      background:linear-gradient(to bottom,var(--az1),var(--az2));
      color:#fff;
      position:relative;
      overflow:hidden;
    }
    body::before{
      content:"";
      position:absolute;inset:-120px;
      background:
        radial-gradient(circle at 20% 20%, rgba(255,102,0,.25), transparent 45%),
        radial-gradient(circle at 80% 30%, rgba(255,255,255,.10), transparent 45%);
      pointer-events:none;
    }
    body::after{
      content:"";
      position:absolute;inset:0;
      background-image:
        linear-gradient(rgba(255,255,255,.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.06) 1px, transparent 1px);
      background-size:42px 42px;
      opacity:.22;
      pointer-events:none;
    }
    .container{
      position:relative;
      flex:1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding:40px 20px;
      text-align:center;
    }
    .code{
      font-size:8em;
      font-weight:900;
      opacity:.15;
      margin:0;
      line-height:1;
    }
    h1{
      margin:0 0 12px;
      font-size:1.8em;
    }
    p{
      margin:0 0 24px;
      opacity:.85;
      font-size:1.1em;
      max-width:480px;
    }
    .btn{
      display:inline-flex;
      align-items:center;
      gap:10px;
      border:0;
      border-radius:14px;
      padding:14px 24px;
      font-weight:900;
      font-size:1.05em;
      text-decoration:none;
      cursor:pointer;
      transition:.18s;
      box-shadow:0 10px 22px rgba(0,0,0,.22);
      background:linear-gradient(to bottom, #004080, #0066cc);
      color:#fff;
    }
    .btn:hover{
      transform:translateY(-3px);
      box-shadow:0 14px 28px rgba(0,0,0,.30);
      background:linear-gradient(to bottom, #0055aa, #0077ee);
    }
    .links{
      margin-top:20px;
      display:flex;
      gap:14px;
      flex-wrap:wrap;
      justify-content:center;
    }
    .links a{
      color:rgba(255,255,255,.8);
      text-decoration:none;
      font-size:.95em;
      border-bottom:1px solid rgba(255,255,255,.3);
      transition:.15s;
    }
    .links a:hover{
      color:#fff;
      border-bottom-color:#fff;
    }
    footer{
      position:relative;
      text-align:center;
      padding:20px;
      opacity:.7;
      font-size:.9em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="code">404</div>
    <h1>Página no encontrada</h1>
    <p>La página que buscás no existe o fue movida. Podés volver al inicio o explorar las secciones del sitio.</p>
    <a class="btn" href="/">Volver al inicio</a>
    <div class="links">
      <a href="/directorio.html">Directorio</a>
      <a href="/historia.html">Historia</a>
      <a href="/colaboradores.html">Colaboradores</a>
      <a href="/notas.html">Notas</a>
    </div>
  </div>
  <footer>defensacivil.com.ar</footer>
</body>
</html>
