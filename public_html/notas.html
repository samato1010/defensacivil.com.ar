<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Notas · Defensa Civil</title>
  <style>
    :root{
      --az1:#003366; --az2:#004080; --n:#ff6600;
      --bg:#f8f9fa; --card:#fff; --tx:#222; --mut:#555;
      --b:rgba(0,0,0,.10); --r:14px; --link:#0066cc;
    }
    *{box-sizing:border-box}
    body{font-family:Arial,Helvetica,sans-serif;margin:0;background:var(--bg);color:var(--tx);}
    header{background:linear-gradient(to bottom,var(--az1),var(--az2));color:#fff;padding:18px 16px;}
    .head{max-width:1100px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;}
    h1{margin:0;font-size:1.35em}
    .sub{opacity:.92;margin:6px 0 0}
    .nav a{
      text-decoration:none;color:#fff;background:rgba(255,255,255,.12);
      padding:10px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.20);
      font-weight:900;display:inline-flex;align-items:center;gap:8px;margin-left:8px;transition:.15s;
    }
    .nav a:hover{background:rgba(255,255,255,.20);transform:translateY(-1px);}
    .wrap{max-width:1100px;margin:18px auto;padding:0 16px 60px;}
    .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 0;}
    .tool{
      background:#fff;border:1px solid var(--b);border-radius:999px;padding:10px 12px;
      display:flex;gap:10px;align-items:center;box-shadow:0 2px 10px rgba(0,0,0,.04);
    }
    .tool label{font-weight:900;color:var(--az1);white-space:nowrap;font-size:.95em;}
    .tool input,.tool select{border:0;outline:0;background:transparent;font-size:1em;min-width:240px;}
    .tool select{min-width:200px;cursor:pointer}
    @media(max-width:560px){.tool input{min-width:200px}}
    .card{
      background:var(--card);
      border:1px solid rgba(0,0,0,.08);
      border-radius:var(--r);
      box-shadow:0 6px 16px rgba(0,0,0,.06);
      padding:16px;
      margin:12px 0;
      position: relative;
    }
    .title{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;}
    .badge{
      display:inline-flex;align-items:center;font-weight:900;color:var(--az1);
      background:#eaf1ff;border:1px solid rgba(0,51,102,.12);padding:4px 10px;border-radius:999px;white-space:nowrap;
    }
    .small{color:var(--mut);font-size:.92em;}
    .note-title{margin:10px 0 8px;color:var(--az1);font-size:1.18em;font-weight:900;}
    .note-body{color:var(--tx);line-height:1.5;margin:0 0 1em;}
    a{color:var(--link);font-weight:900;text-decoration:none;}
    a:hover{text-decoration:underline;color:var(--az2);}
    .msg{background:#fff;border:1px solid rgba(0,0,0,.12);border-radius:12px;padding:12px;}
    .msg.err{background:#fff3f3;border-color:rgba(180,0,0,.2);color:#7a0000;}
    footer{background:var(--az1);color:#fff;text-align:center;padding:30px 20px;margin-top:40px;font-size:1.05em;}
    footer a{color:#fff;font-weight:900;text-decoration:none;}
    footer a:hover{text-decoration:underline;}
    .fmut{opacity:.92}

    /* Estilo para el botón lupa (solo si hay imagen) */
    .zoom-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 36px;
      height: 36px;
      font-size: 1.2em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0.8;
      transition: opacity 0.2s;
    }
    .zoom-btn:hover { opacity: 1; }

    /* Modal / Popup */
    #imageModal {
      display: none;
      position: fixed;
      z-index: 1000;
      left: 0;
      top: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0,0,0,0.9);
      align-items: center;
      justify-content: center;
      overflow: auto;
    }
    #modalContent {
      position: relative;
      max-width: 90%;
      max-height: 90vh;
    }
    #modalImage {
      max-width: 100%;
      max-height: 85vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 0 30px rgba(0,0,0,0.8);
    }
    #closeModal {
      position: absolute;
      top: -40px;
      right: 0;
      color: white;
      font-size: 2.5em;
      font-weight: bold;
      cursor: pointer;
    }
    #closeModal:hover { color: #ff6600; }
  </style>
</head>
<body>

<!-- Modal (se agrega una sola vez) -->
<div id="imageModal">
  <div id="modalContent">
    <span id="closeModal">&times;</span>
    <img id="modalImage" src="" alt="Imagen ampliada">
  </div>
</div>

<header>
  <div class="head">
    <div>
      <h1>Notas</h1>
      <div class="sub" id="sub">Actualizaciones, seguimiento y artículos cortos</div>
    </div>
    <div class="nav">
      <a href="/index.html">🏠 Inicio</a>
      <a href="/directorio.html">📒 Directorio</a>
      <a href="/historia.html">🕰️ Historia</a>
      <a href="/colaboradores.html">🤝 Colaboradores</a>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="row">
    <div class="tool"><label>🔎 Buscar</label><input id="q" placeholder="tema, provincia, palabra clave..."></div>
    <div class="tool"><label>🏷️ Categoría</label><select id="cat"><option value="">Todas</option></select></div>
    <div class="tool"><label>🗺️ Provincia</label><select id="prov"><option value="">Todas</option></select></div>
  </div>
  <div id="info" class="small"></div>
  <div id="list"></div>
  <div class="msg" style="margin-top:16px;">
    ¿Querés aportar una nota o corrección? Escribí a <b><a href="mailto:samato@hst.com.ar">samato@hst.com.ar</a></b>
  </div>
</div>

<footer>
  <div class="fmut">Coordinación: Lic. Sebastián Amato · <a href="mailto:samato@hst.com.ar">samato@hst.com.ar</a></div>
  <div style="margin-top:12px;opacity:.9;">defensacivil.com.ar © 2026</div>
</footer>

<script>
  const JSON_URL = "/data/notas.json";
  const UPLOAD_PATH = "/uploads/notas/";
  let DATA = { meta:{}, notes:[] };

  function escapeHtml(s){
    return (s ?? '').toString().replace(/[&<>"']/g, m => ({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
    }[m]));
  }

  function normalize(s){
    return (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
  }

  function uniqSorted(arr){
    return Array.from(new Set(arr.filter(Boolean))).sort((a,b)=>a.localeCompare(b,"es",{sensitivity:"base"}));
  }

  function fillSelect(id, items, allLabel){
    const sel = document.getElementById(id);
    const cur = sel.value || "";
    sel.innerHTML = `<option value="">${allLabel}</option>` + items.map(v=>`<option value="${escapeHtml(v)}">${escapeHtml(v)}</option>`).join("");
    sel.value = cur;
  }

  // Modal logic
  const modal = document.getElementById("imageModal");
  const modalImg = document.getElementById("modalImage");
  const closeBtn = document.getElementById("closeModal");

  function openModal(src, alt) {
    modalImg.src = src;
    modalImg.alt = alt;
    modal.style.display = "flex";
  }

  function closeModal() {
    modal.style.display = "none";
  }

  closeBtn.onclick = closeModal;
  modal.onclick = function(e) {
    if (e.target === modal) closeModal();
  };
  document.addEventListener('keydown', e => {
    if (e.key === "Escape") closeModal();
  });

  function render(){
    const q = document.getElementById("q").value.trim();
    const cat = document.getElementById("cat").value;
    const prov = document.getElementById("prov").value;

    let items = [...(DATA.notes || [])];

    if (cat) items = items.filter(n => (n.categoria||"") === cat);
    if (prov) items = items.filter(n => (n.provincia||"") === prov);
    if (q){
      const nq = normalize(q);
      items = items.filter(n => {
        const hay = normalize([n.titulo,n.texto,n.categoria,n.provincia,n.fecha].join(" "));
        return hay.includes(nq);
      });
    }

    items.sort((a,b)=> (String(b.fecha||"")).localeCompare(String(a.fecha||"")));

    document.getElementById("info").textContent =
      `${items.length} notas · actualizado: ${DATA.meta?.updated || "—"}`;

    const list = document.getElementById("list");
    list.innerHTML = "";

    if (!items.length){
      list.innerHTML = `<div class="msg">No hay notas con esos filtros.</div>`;
      return;
    }

    items.forEach(n => {
      const card = document.createElement("div");
      card.className = "card";

      const links = (n.links||[])
        .filter(x => x && x.href)
        .map(l => `<a href="${escapeHtml(l.href)}">${escapeHtml(l.label||"Ver")}</a>`)
        .join(" · ");

      let zoomBtn = "";
      if (n.imagen && typeof n.imagen === "string" && n.imagen.trim() !== "") {
        const imgSrc = UPLOAD_PATH + escapeHtml(n.imagen);
        zoomBtn = `<button class="zoom-btn" title="Ver imagen ampliada" onclick="openModal('${imgSrc}', '${escapeHtml(n.titulo || 'Imagen de la nota')}')">🔍</button>`;
      }

      card.innerHTML = `
        ${zoomBtn}
        <div class="title">
          <div class="badge">${escapeHtml(n.categoria || "Nota")}</div>
          <div class="small">${escapeHtml(n.fecha || "—")} · ${escapeHtml(n.provincia || "—")}</div>
        </div>
        <div class="note-title">${escapeHtml(n.titulo || "—")}</div>
        <p class="note-body">${escapeHtml(n.texto || "")}</p>
        ${links ? `<div class="small" style="margin-top:10px;">${links}</div>` : ""}
      `;

      list.appendChild(card);
    });
  }

  async function load(){
    try{
      const res = await fetch(JSON_URL + "?ts=" + Date.now(), { cache:"no-store" });
      const txt = await res.text();
      if(!res.ok) throw new Error("HTTP " + res.status + " al cargar " + JSON_URL);
      const j = JSON.parse(txt);
      DATA.meta = j.meta || {};
      DATA.notes = Array.isArray(j.notes) ? j.notes : [];
      document.getElementById("sub").textContent =
        DATA.meta?.subtitulo || "Actualizaciones, seguimiento y artículos cortos";
      fillSelect("cat", uniqSorted(DATA.notes.map(n=>n.categoria)), "Todas");
      fillSelect("prov", uniqSorted(DATA.notes.map(n=>n.provincia)), "Todas");
      render();
    }catch(err){
      document.getElementById("list").innerHTML =
        `<div class="msg err">No se pudo cargar /data/notas.json.<br>Detalle: ${escapeHtml(err?.message || err)}</div>`;
    }
  }

  function debounce(fn, ms=180){
    let t=null;
    return () => { clearTimeout(t); t=setTimeout(fn, ms); };
  }

  document.getElementById("q").addEventListener("input", debounce(render, 180));
  document.getElementById("cat").addEventListener("change", render);
  document.getElementById("prov").addEventListener("change", render);

  load();
</script>
</body>
</html>
